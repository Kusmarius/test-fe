name: Deploy Feature Environment to Amplify

on:
  push:
    branches:
      - 'feature/**'

env:
  AWS_REGION: us-east-1
  DOMAIN_NAME: zergfi.com

jobs:
  deploy-feature:
    name: Deploy Feature Branch to Amplify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Set ENV variables
        id: vars
        run: |
          RAW_BRANCH="${GITHUB_REF#refs/heads/}"  # e.g. feature/amplify-test
          SANITIZED_BRANCH=$(echo "$RAW_BRANCH" | tr '/' '-' | tr '_' '-')
          echo "branch=$RAW_BRANCH" >> $GITHUB_OUTPUT
          echo "env=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Amplify branch (if doesn't exist)
        run: |
          set -e
          BRANCH_EXISTS=$(aws amplify list-branches \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --query "branches[?branchName=='${{ steps.vars.outputs.env }}'] | length(@)")

          if [ "$BRANCH_EXISTS" -eq 0 ]; then
            aws amplify create-branch \
              --app-id ${{ secrets.AMPLIFY_APP_ID }} \
              --branch-name ${{ steps.vars.outputs.env }} \
              --framework "Next.js" \
              --stage DEVELOPMENT \
              --enable-auto-build \
              --backend-environment-arn "" \
              --source-branch-name "${{ steps.vars.outputs.branch }}"
          fi

      - name: Ensure domain association exists
        run: |
          set -e
          DOMAIN_EXISTS=$(aws amplify get-domain-association \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --domain-name ${{ env.DOMAIN_NAME }} 2>/dev/null || echo "not_found")

          if [ "$DOMAIN_EXISTS" = "not_found" ]; then
            echo "Domain association not found. Creating it..."
            aws amplify create-domain-association \
              --app-id ${{ secrets.AMPLIFY_APP_ID }} \
              --domain-name ${{ env.DOMAIN_NAME }} \
              --sub-domain-settings prefix=${{ steps.vars.outputs.env }},branchName=${{ steps.vars.outputs.env }}
          fi

      - name: Associate subdomain (if cert is ready)
        run: |
          set -e

          STATUS=$(aws amplify get-domain-association \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --domain-name ${{ env.DOMAIN_NAME }} \
            --query "domainAssociation.status" --output text)

          if [ "$STATUS" != "AVAILABLE" ]; then
            echo "Domain is not ready (status: $STATUS), skipping subdomain update"
            exit 0
          fi

          aws amplify get-domain-association \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --domain-name ${{ env.DOMAIN_NAME }} > domains.json

          jq \
            --arg prefix "${{ steps.vars.outputs.env }}" \
            --arg branch "${{ steps.vars.outputs.env }}" \
            '.domainAssociation.subDomains
            | map({prefix: .subDomainSetting.prefix, branchName: .subDomainSetting.branchName})
            + [{"prefix": $prefix, "branchName": $branch}]
            | unique
            | {subDomainSettings: .}' \
            domains.json > updated.json

          aws amplify update-domain-association \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --domain-name ${{ env.DOMAIN_NAME }} \
            --cli-input-json file://updated.json

      - name: Trigger Amplify build job
        run: |
          aws amplify start-job \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name ${{ steps.vars.outputs.env }} \
            --job-type RELEASE \
            --job-reason "GitHub Actions deploy for ${{ steps.vars.outputs.env }}"

