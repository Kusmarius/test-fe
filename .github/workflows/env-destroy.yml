name: Destroy Feature Environment on Branch Delete

on:
  delete:
    branches:
      - 'feature/**'

env:
  AWS_REGION: us-east-1
  DOMAIN_NAME: zergfi.com

jobs:
  destroy-feature:
    name: Destroy Feature Branch Environment
    runs-on: ubuntu-latest

    steps:
      - name: Set ENV variables
        id: vars
        run: |
          RAW_BRANCH="${GITHUB_REF##*/}"
          SANITIZED_BRANCH=$(echo "$RAW_BRANCH" | tr '/' '-' | tr '_' '-')
          echo "branch=$RAW_BRANCH" >> $GITHUB_OUTPUT
          echo "env=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete Amplify branch
        run: |
          echo "Deleting Amplify branch: ${{ steps.vars.outputs.env }}"
          aws amplify delete-branch \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name ${{ steps.vars.outputs.env }}

      - name: Get current domain association
        id: get-domains
        run: |
          aws amplify get-domain-association \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --domain-name ${{ env.DOMAIN_NAME }} > domains.json

      - name: Filter out deleted subdomain and update association
        run: |
          SUBDOMAIN_TO_REMOVE="${{ steps.vars.outputs.env }}"
          jq \
            --arg prefix "$SUBDOMAIN_TO_REMOVE" \
            '.domainAssociation.subDomains
            | map(select(.subDomainSetting.prefix != $prefix))
            | {subDomainSettings: map({prefix: .subDomainSetting.prefix, branchName: .subDomainSetting.branchName})}' \
            domains.json > updated.json

          echo "Updating domain association without $SUBDOMAIN_TO_REMOVE..."
          aws amplify update-domain-association \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --domain-name ${{ env.DOMAIN_NAME }} \
            --cli-input-json file://updated.json

